name: Publish oks-connector to PyPI

# Trusted Publishing (OIDC) — no API token stored.
# Triggered by pushing a tag like v0.1.0. Builds the package at the repo
# root and uploads to pypi.org.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests before publish
        # v0.6.10 教训 (OKS): publish workflow 不跑测试 → broken 版本直接发 PyPI.
        # 加此 gate: 测试 fail 则 build fail, broken 版本不会到 PyPI.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest requests
          python -m pytest scripts/tests/ -q

      - name: Install build backend
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build --outdir dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
